# ============================================================================
# Development compose — erp-frontend
# Usage: docker compose -f .docker/compose.yml up
# ============================================================================

services:
  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      # Astro calls the API from the server, not from the browser.
      API_URL: http://host.docker.internal:8000
    volumes:
      - ../src:/app/src:cached
      - ../public:/app/public:cached
      - ../astro.config.mjs:/app/astro.config.mjs:ro
      - ../tsconfig.json:/app/tsconfig.json:ro
